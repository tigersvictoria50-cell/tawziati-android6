name: Build Tawziati Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Tawziati project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'Tawziati_GitHub_BuildReady_v1*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          unzip -o "$ZIP_FILE"
          cd Tawziati_Android

          echo "Project files:"
          find . -maxdepth 2 -type f | sort

      - name: Build APK
        run: |
          cd Tawziati_Android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tawziati-debug-apk
          path: Tawziati_Android/app/build/outputs/apk/debug/*.apk
